let remixBuffer=null,remixSource=null;
const remixAudioFallback=new Audio(remixAudioData);
remixAudioFallback.preload='auto';
async function prepareRemixAudio(){
 try{
  unlockAudio();
  if(beepContext && !remixBuffer){
   const response=await fetch(remixAudioData);
   remixBuffer=await beepContext.decodeAudioData(await response.arrayBuffer());
  }
 }catch(e){}
}
// Decode early to avoid a delay when the button is pressed.
prepareRemixAudio();
function playRemixCue(){
 try{if(remixSource){remixSource.stop();remixSource.disconnect();remixSource=null}}catch(e){}
 try{remixAudioFallback.pause();remixAudioFallback.currentTime=0}catch(e){}
 if(!soundEnabled)return;
 if(beepContext && beepContext.state==='running' && remixBuffer){
  try{
   const source=beepContext.createBufferSource();source.buffer=remixBuffer;
   const gain=beepContext.createGain();gain.gain.value=.9;
   source.connect(gain);gain.connect(beepContext.destination);
   source.start();remixSource=source;return;
  }catch(e){}
 }
 remixAudioFallback.play().catch(()=>{});
}
$('remix').onclick=()=>{
 unlockAudio();remixEnd=Date.now()+10000;clearInterval(remixTicker);
 render();playRemixCue();
 remixTicker=setInterval(()=>{render();if(Date.now()>=remixEnd){clearInterval(remixTicker);remixTicker=null;try{remixAudioFallback.pause()}catch(e){}}},100);
};
