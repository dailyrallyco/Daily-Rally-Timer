shortBeep.preload='auto';longBeep.preload='auto';
function unlockAudio(){shortBeep.load();longBeep.load()}
function beep(long=false){
 if(!soundEnabled)return;
 const a=long?longBeep:shortBeep;
 try{a.pause();a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{$('audioStatus').textContent='Sound blocked. Tap Test Sound again and check iPhone media volume.'})}catch(e){$('audioStatus').textContent='Sound could not play: '+e.message}
}
function countdownSound(){if(!running||!soundEnabled)return;const s=sections[section];if(s.kind!=='circuit')return;const c=current(),remaining=Math.ceil(c.remaining),block=s.work+s.rest,blockIndex=Math.floor(Math.min(elapsed,total(s)-.001)/block);const key=section+':'+blockIndex+':'+(c.work?'w':'r')+':'+remaining;if(remaining>=1&&remaining<=5&&key!==lastBeepKey){lastBeepKey=key;beep(false)}else if(remaining>5){lastBeepKey=''}}
function current(){let s=sections[section],e=Math.min(elapsed,total(s));if(s.kind==='simple')return {remaining:total(s)-e,phase:'CLASS TIMER',round:''};let block=s.work+s.rest,idx=Math.min(Math.floor(e/block),s.rounds*s.stations.length-1),within=e%block,work=within<s.work;return {remaining:work?s.work-within:block-within,phase:work?'WORK':'SWITCH / RECOVER',round:'ROUND '+(Math.floor(idx/s.stations.length)+1)+' OF '+s.rounds+' · STATION '+(idx%s.stations.length+1)+' OF '+s.stations.length,active:idx%s.stations.length,upcoming:(idx+1)%s.stations.length,work}}
function render(){const s=sections[section],c=current();$('title').textContent=s.title;$('phase').textContent=c.phase;$('clock').textContent=format(c.remaining);$('round').textContent=c.round;$('stations').style.gridTemplateColumns='repeat('+((window.matchMedia('(orientation: landscape) and (max-height: 600px)').matches)?Math.min(4,(s.stations||s.items).length):Math.min(3,(s.stations||s.items).length))+',1fr)';$('stations').innerHTML=(s.stations||s.items).map((a,i)=>'<div class="station '+(s.kind==='circuit'?(c.work?(i===c.active?'active':''):(i===c.upcoming?'active upcoming':'')):'')+'"><small>'+a[0]+'</small><strong>'+a[1]+'</strong><span>'+a[2]+'</span></div>').join('');$('title').title=s.roulette?'Tap title to show/hide roulette challenges':'';$('hint').textContent=s.hint+(section===1&&c.round.startsWith('ROUND 3')?'  🔥 COACH: CALL REMIX DURING THIS ROUND!':'');$('remix').disabled=!(section===1||section===2||section===4);$('remix').textContent=section===4?'🎲 PICK 1–6':'🔥 REMIX!';updateRemix();$('roulette').hidden=!s.roulette || (window.matchMedia('(orientation: landscape) and (max-height: 600px)').matches && !rouletteOpen);$('start').textContent=running?'Pause':elapsed>=total(s)?'Restart':'Start';$('sound').textContent=soundEnabled?'🔊 Beeps ON':'🔇 Beeps OFF';$('sound').setAttribute('aria-pressed',String(soundEnabled));$('picker').innerHTML=sections.map((x,i)=>'<button class="'+(i===section?'':'secondary')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');$('picker').querySelectorAll('button').forEach(b=>b.onclick=()=>change(+b.dataset.i));}
function updateRemix(){const remaining=Math.ceil((remixUntil-performance.now())/1000),b=$('remixBanner');b.hidden=remaining<=0;if(remaining>0)b.textContent='🔥 REMIX! '+remaining+'s — '+(section===1?'CHANGE YOUR TEMPO!':'COACH CALLS: GREEN / YELLOW / RED!')}
function triggerRemix(){if(section===4){rouletteOpen=!rouletteOpen;render();return}if(!(section===1||section===2))return;remixUntil=performance.now()+10000;beep(true);updateRemix();clearInterval(remixInterval);remixInterval=setInterval(()=>{updateRemix();if(performance.now()>=remixUntil)clearInterval(remixInterval)},100)}
function stop(){if(running){elapsed=Math.min(total(sections[section]),(performance.now()-startedAt)/1000);running=false}clearInterval(interval);interval=null}
function tick(){
 const oldElapsed=elapsed;
 const newE=(performance.now()-startedAt)/1000;
 const s=sections[section];
 if(newE>=total(s)){
   elapsed=total(s);stop();render();beep(true);return;
 }
 elapsed=newE;
 const block=s.kind==='circuit'?s.work+s.rest:0;
 const crossedBoundary=block>0 && Math.floor(elapsed)!==Math.floor(oldElapsed) && (Math.floor(elapsed)%block===s.work || Math.floor(elapsed)%block===0);
 // Update the visible countdown first; then request the matching beep in this same tick.
 render();
 if(crossedBoundary){lastBeepKey='';beep(true)}
 else countdownSound();
}
function change(i){lastBeepKey='';rouletteOpen=false;stop();remixUntil=0;clearInterval(remixInterval);section=Math.max(0,Math.min(sections.length-1,i));elapsed=0;render()}
$('sound').onclick=()=>{soundEnabled=!soundEnabled;if(soundEnabled)beep();render()};$('testSound').onclick=()=>{soundEnabled=true;render();beep(true);$('audioStatus').textContent='Test sound requested. If silent, check media volume and audio output.'};$('remix').onclick=triggerRemix;$('start').onclick=()=>{if(running){stop();render();return}if(elapsed>=total(sections[section]))elapsed=0;unlockAudio();running=true;startedAt=performance.now()-elapsed*1000;interval=setInterval(tick,40);render()};$('reset').onclick=()=>{stop();elapsed=0;lastBeepKey='';render()};$('prev').onclick=()=>change(section-1);$('next').onclick=()=>change(section+1);$('title').addEventListener('click',()=>{if(sections[section].roulette){rouletteOpen=!rouletteOpen;render()}});$('numbers').innerHTML=challenges.map((_,i)=>'<button data-i="'+i+'">'+(i+1)+'</button>').join('');$('numbers').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('reveal').textContent=challenges[+b.dataset.i]});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const buttons=[...document.querySelectorAll('button:not(:disabled)')];const i=buttons.indexOf(document.activeElement);if(i>=0){e.preventDefault();buttons[(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()}}});window.addEventListener('resize',render);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){stop();render()}});render();
</script></body></html>
