<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101510"><title>Daily Rally | Remix Timer</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#f7f3e8;background:#101510}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;justify-content:space-between;color:#b7e58d;font-size:12px;font-weight:bold;letter-spacing:1px}.wrap{max-width:1100px;margin:auto}.top{text-align:center;margin:20px 0 8px}h1{font-size:clamp(24px,5vw,52px);margin:8px 0}#phase{color:#b7e58d;font-weight:bold;letter-spacing:2px}#clock{font-size:clamp(85px,18vw,190px);line-height:1;font-weight:900;color:#b7e58d;font-variant-numeric:tabular-nums;margin:8px 0}#round{font-size:18px;color:#c8cbbf}.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.station{background:#253329;border:2px solid #476b45;border-radius:14px;min-height:125px;padding:15px;display:flex;flex-direction:column;justify-content:center;text-align:center}.station.active{background:#b7e58d;color:#102010;border-color:#f7f3e8;box-shadow:0 0 0 3px #7cbb62,0 0 22px #8aca65}.station.active small,.station.active span{color:#1c381f}.station.upcoming{border-color:#e9c977}.station small{color:#b7e58d;font-size:16px}.station strong{font-size:clamp(18px,3vw,34px);margin-top:10px}.station span{font-size:13px;color:#d5d9ce;margin-top:9px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}button,select{font:inherit;border-radius:10px;padding:13px 17px;background:#b7e58d;color:#142014;border:0;font-weight:800;cursor:pointer}button.secondary{background:#303c32;color:white;border:1px solid #61725f}button:disabled{opacity:.45}.hint{text-align:center;color:#d4d8ce;font-size:14px;margin:18px auto;max-width:800px}.picker{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}.picker button{padding:10px 13px}.roulette{margin:15px auto;padding:18px;border:1px solid #587451;border-radius:12px;max-width:700px;text-align:center}.roulette h2{color:#b7e58d}.remix-banner{background:#e9c977;color:#172217;border-radius:14px;text-align:center;padding:12px;font-size:clamp(18px,4vw,34px);font-weight:900;margin:10px 0}.remix-banner[hidden]{display:none}.remix-button{background:#e9c977}.foot{text-align:center;color:#aebbaa;margin-top:28px;font-size:12px}@media(max-width:600px){body{padding:12px}.stations{gap:5px}.station{padding:6px;min-height:105px}.station.active{background:#b7e58d;color:#102010;border-color:#f7f3e8;box-shadow:0 0 0 3px #7cbb62,0 0 22px #8aca65}.station.active small,.station.active span{color:#1c381f}.station.upcoming{border-color:#e9c977}.station small{font-size:12px}.station strong{font-size:clamp(12px,3.4vw,19px)}.station span{font-size:10px}#clock{font-size:22vw}button{padding:11px 13px}}@media(orientation:landscape) and (max-height:500px){.top{margin:5px 0}h1{font-size:26px}#clock{font-size:70px}.stations{margin:8px 0}.station{min-height:70px}.hint,.foot{display:none}}
/* TV landscape: keep controls and all stations within the visible iPhone viewport. */
@media (orientation:landscape) and (max-height:600px){
 html,body{height:100%;overflow:hidden}body{padding:4px 8px}.wrap{height:100dvh;display:flex;flex-direction:column;max-width:none;overflow:hidden}header{font-size:9px;line-height:12px;flex:none}.top{margin:0;flex:none;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;min-height:0}.top h1{grid-column:1;grid-row:1/3;font-size:clamp(13px,2.8vw,23px);line-height:1.05;text-align:left;margin:0}.top #phase{grid-column:2;grid-row:1;font-size:10px;line-height:12px}.top #clock{grid-column:2;grid-row:2;font-size:clamp(35px,10vh,62px);line-height:1;margin:0}.top #round{grid-column:3;grid-row:1/3;font-size:11px;line-height:1.2;text-align:right}.stations{flex:1;min-height:0;margin:3px 0;gap:6px;align-items:stretch}.station{min-height:0;padding:4px 6px;border-radius:7px;box-shadow:none!important;overflow:hidden}.station small{font-size:10px}.station strong{font-size:clamp(12px,2.5vw,19px);line-height:1.1;margin-top:3px}.station span{font-size:10px;line-height:1.1;margin-top:3px}.controls{flex:none;flex-wrap:nowrap;gap:5px;margin:2px 0 4px}.controls button{flex:1;min-width:0;padding:7px 3px;font-size:clamp(10px,1.8vw,13px);border-radius:7px;white-space:nowrap}.hint,.foot,.picker{display:none!important}.remix-banner{flex:none;margin:2px 0;padding:3px;font-size:14px;line-height:18px}.roulette{position:fixed;z-index:5;inset:auto 8px 43px 8px;max-width:none;margin:0;padding:6px;background:#101b12;box-shadow:0 0 0 2px #b7e58d}.roulette h2{font-size:13px;margin:0}.roulette p{font-size:11px;margin:3px}.roulette .picker{display:flex!important;margin:3px}.roulette .picker button{padding:5px 10px;font-size:12px}
}
</style></head><body><main class="wrap"><header><span>DAILY RALLY TRAINING CLUB</span><span>RALLY REMIX · MIX IT UP!</span></header><section class="top"><h1 id="title"></h1><div id="phase"></div><div id="clock" aria-live="off">08:00</div><div id="round"></div></section><section class="stations" id="stations"></section><div class="remix-banner" id="remixBanner" hidden></div><div class="hint" id="hint"></div><div class="controls"><button id="start">Start</button><button class="remix-button" id="remix">🔥 REMIX!</button><button class="secondary" id="reset">Reset</button><button class="secondary" id="prev">◀ Previous</button><button class="secondary" id="next">Next ▶</button></div><div class="picker" id="picker"></div><section class="roulette" id="roulette" hidden><h2>REMIX ROULETTE</h2><p>Choose a number to reveal your challenge.</p><div class="picker" id="numbers"></div><p id="reveal">Pick 1–6!</p></section><div class="foot">Keep Safari open and the iPhone awake during class. Test AirPlay and audio before participants arrive.</div></main><script>
const challenges=['Squat Party — controlled squats with a pause','Quick Feet — agility squares or step-touches','Punch It Out — alternating shadowboxing punches','Glute Groove — standing glute kickbacks','Knee Drive Remix — alternating knee drives','Coach’s Choice — safe favorite movement'];
const sections=[
{title:'WELCOME & WARM-UP',kind:'simple',duration:480,items:[['01','MARCH + STEP TOUCH','2 min'],['02','MOBILITY + SQUATS','3 min'],['03','KNEES + HAMSTRING CURLS','3 min']],hint:'8-minute coach-led warm-up. Timer counts down continuously.'},
{title:'STRENGTH MEETS CARDIO',kind:'circuit',work:45,rest:15,rounds:3,stations:[['01','GOBLET SQUATS','Bodyweight / bench option'],['02','ROW / CARDIO','Rowers or standing cardio'],['03','SHOULDER PRESS','Light dumbbell option']],hint:'3 rounds × 3 stations = 9 minutes. Allow 3 minutes for demonstration, water and coaching. Everyone rotates together.'},
{title:'THE FUN ZONE',kind:'circuit',work:45,rest:15,rounds:3,stations:[['01','BATTLE ROPE WAVES','Alternate turns / shadowbox'],['02','AGILITY SQUARES','Walk or quick feet'],['03','SLAM BALL SLAMS','Light ball / press-out']],hint:'3 rounds × 3 stations = 9 minutes. Allow 3 minutes for demonstration and recovery. Coach Calls: GREEN fast, YELLOW slow, RED freeze.'},
{title:'CORE & CONTROL',kind:'circuit',work:40,rest:20,rounds:2,stations:[['01','DEAD BUGS','Heel slide option'],['02','STANDING KNEE-TO-ELBOW','Slow knee lifts'],['03','BIRD DOGS','Arm reach option'],['04','FARMER CARRY','Suitcase hold option']],hint:'2 rounds × 4 stations = 8 minutes. Add 2 minutes for balance challenge and coaching.'},
{title:'REMIX ROULETTE',kind:'circuit',work:30,rest:30,rounds:10,stations:[['★','CHOOSE 1–6','30 seconds of movement'],['↻','RECOVER','30 seconds of recovery'],['✓','KEEP MOVING','Repeat for 10 rounds']],hint:'10 rounds × 1 minute = 10 minutes. Pick a new challenge before each work interval.',roulette:true},
{title:'COOLDOWN',kind:'simple',duration:480,items:[['01','SLOW WALK + BREATHE','2 min'],['02','LOWER BODY STRETCH','3 min'],['03','UPPER BODY STRETCH','3 min']],hint:'8-minute cooldown. End with a great job and class wrap-up.'}
];
let rouletteOpen=false;let section=0,elapsed=0,running=false,startedAt=0,interval=null,remixUntil=0,remixInterval=null;const $=id=>document.getElementById(id);
function total(s){return s.kind==='simple'?s.duration:s.rounds*s.stations.length*(s.work+s.rest)}
function format(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=780;g.gain.value=.06;o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch(e){}}
function current(){let s=sections[section],e=Math.min(elapsed,total(s));if(s.kind==='simple')return {remaining:total(s)-e,phase:'CLASS TIMER',round:''};let block=s.work+s.rest,idx=Math.min(Math.floor(e/block),s.rounds*s.stations.length-1),within=e%block,work=within<s.work;return {remaining:work?s.work-within:block-within,phase:work?'WORK':'SWITCH / RECOVER',round:'ROUND '+(Math.floor(idx/s.stations.length)+1)+' OF '+s.rounds+' · STATION '+(idx%s.stations.length+1)+' OF '+s.stations.length,active:idx%s.stations.length,upcoming:(idx+1)%s.stations.length,work}}
function render(){const s=sections[section],c=current();$('title').textContent=s.title;$('phase').textContent=c.phase;$('clock').textContent=format(c.remaining);$('round').textContent=c.round;$('stations').style.gridTemplateColumns='repeat('+((window.matchMedia('(orientation: landscape) and (max-height: 600px)').matches)?Math.min(4,(s.stations||s.items).length):Math.min(3,(s.stations||s.items).length))+',1fr)';$('stations').innerHTML=(s.stations||s.items).map((a,i)=>'<div class="station '+(s.kind==='circuit'?(c.work?(i===c.active?'active':''):(i===c.upcoming?'active upcoming':'')):'')+'"><small>'+a[0]+'</small><strong>'+a[1]+'</strong><span>'+a[2]+'</span></div>').join('');$('title').title=s.roulette?'Tap title to show/hide roulette challenges':'';$('hint').textContent=s.hint+(section===1&&c.round.startsWith('ROUND 3')?'  🔥 COACH: CALL REMIX DURING THIS ROUND!':'');$('remix').disabled=!(section===1||section===2||section===4);$('remix').textContent=section===4?'🎲 PICK 1–6':'🔥 REMIX!';updateRemix();$('roulette').hidden=!s.roulette || (window.matchMedia('(orientation: landscape) and (max-height: 600px)').matches && !rouletteOpen);$('start').textContent=running?'Pause':elapsed>=total(s)?'Restart':'Start';$('picker').innerHTML=sections.map((x,i)=>'<button class="'+(i===section?'':'secondary')+'" data-i="'+i+'">'+(i+1)+'</button>').join('');$('picker').querySelectorAll('button').forEach(b=>b.onclick=()=>change(+b.dataset.i));}
function updateRemix(){const remaining=Math.ceil((remixUntil-performance.now())/1000),b=$('remixBanner');b.hidden=remaining<=0;if(remaining>0)b.textContent='🔥 REMIX! '+remaining+'s — '+(section===1?'CHANGE YOUR TEMPO!':'COACH CALLS: GREEN / YELLOW / RED!')}
function triggerRemix(){if(section===4){rouletteOpen=!rouletteOpen;render();return}if(!(section===1||section===2))return;remixUntil=performance.now()+10000;beep();updateRemix();clearInterval(remixInterval);remixInterval=setInterval(()=>{updateRemix();if(performance.now()>=remixUntil)clearInterval(remixInterval)},100)}
function stop(){if(running){elapsed=Math.min(total(sections[section]),(performance.now()-startedAt)/1000);running=false}clearInterval(interval);interval=null}
function tick(){let old=Math.floor(elapsed),newE=(performance.now()-startedAt)/1000;if(newE>=total(sections[section])){elapsed=total(sections[section]);stop();beep();render();return}elapsed=newE;const s=sections[section];if(s.kind==='circuit'&&Math.floor(elapsed)!==old&&(Math.floor(elapsed)%(s.work+s.rest)===s.work||Math.floor(elapsed)%(s.work+s.rest)===0))beep();$('clock').textContent=format(current().remaining);$('phase').textContent=current().phase;$('round').textContent=current().round;render()}
function change(i){rouletteOpen=false;stop();remixUntil=0;clearInterval(remixInterval);section=Math.max(0,Math.min(sections.length-1,i));elapsed=0;render()}
$('remix').onclick=triggerRemix;$('start').onclick=()=>{if(running){stop();render();return}if(elapsed>=total(sections[section]))elapsed=0;running=true;startedAt=performance.now()-elapsed*1000;interval=setInterval(tick,120);render()};$('reset').onclick=()=>{stop();elapsed=0;render()};$('prev').onclick=()=>change(section-1);$('next').onclick=()=>change(section+1);$('title').addEventListener('click',()=>{if(sections[section].roulette){rouletteOpen=!rouletteOpen;render()}});$('numbers').innerHTML=challenges.map((_,i)=>'<button data-i="'+i+'">'+(i+1)+'</button>').join('');$('numbers').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('reveal').textContent=challenges[+b.dataset.i]});window.addEventListener('resize',render);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){stop();render()}});render();
</script></body></html>
