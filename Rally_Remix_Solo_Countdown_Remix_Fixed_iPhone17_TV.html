function unlockAudio(){

 try{

window.addEventListener('keydown',e=>{if(['Space','ArrowRight','ArrowLeft','KeyR'].includes(e.code)){e.preventDefault();if(e.code==='Space')$('start').click();if(e.code==='ArrowRight')$('next').click();if(e.code==='ArrowLeft')$('prev').click();if(e.code==='KeyR')$('remix').click()}});render();
</script></body></html>
